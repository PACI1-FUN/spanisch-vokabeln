  header h1 { margin:0; font-size:1.3rem; }
  .langsel { -webkit-appearance:none; appearance:none; background-color:transparent; color:#fff; border:none; font:inherit; font-weight:700;
    padding:2px 26px 2px 2px; margin:0; cursor:pointer; border-radius:6px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='white' stroke-width='2'/></svg>");
    background-repeat:no-repeat; background-position:right 4px center; background-size:13px 9px; }
  .langsel:hover, .langsel:focus { background-color:rgba(255,255,255,.15); outline:none; }
  .langsel option { color:#222; background:#fff; }
  nav button { background:transparent; color:#fff; border:2px solid rgba(255,255,255,.6); border-radius:8px; padding:6px 14px; margin-left:6px; cursor:pointer; font-size:.95rem; }
  nav button.active { background:#fff; color:var(--bar); }
  main { max-width:760px; margin:24px auto; padding:0 16px; }
  .topic { color:var(--muted); margin-bottom:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .topic select { font-size:1rem; padding:7px 12px; border:2px solid var(--blue); border-radius:8px; background:#fff; color:var(--ink); cursor:pointer; }

  .boxes { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:10px; }
  .bx { background:var(--card); border-radius:10px; padding:10px 6px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.08); border-top:5px solid var(--blue); cursor:pointer; user-select:none; border-left:3px solid transparent; border-right:3px solid transparent; border-bottom:3px solid transparent; }
  .bx.active { border-color:var(--blue); background:#eef2ff; }
  .bx.b1.active { border-color:#c0392b; background:#fbeceb; } .bx.b5.active { border-color:#2e8b57; background:#e8f5ed; }
  .bx.b1 { border-top-color:#c0392b; } .bx.b5 { border-top-color:#2e8b57; }
  .bx .n { display:block; font-size:1.5rem; font-weight:700; }
  .bx .t { display:block; font-size:.9rem; font-weight:600; }
  .bx .s { display:block; font-size:.7rem; color:var(--muted); }
  .stats { display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .stat { background:var(--card); border-radius:10px; padding:8px 16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .stat b { margin-right:6px; font-size:1.2rem; color:var(--blue); }

  .flash { background:var(--card); border-radius:18px; box-shadow:0 4px 14px rgba(0,0,0,.1); min-height:280px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; cursor:pointer; padding:24px; user-select:none; }
  .flash.back { background:#eef2ff; }
  .emoji { font-size:5rem; line-height:1; }
  .emoji.pair { font-size:3.6rem; }
  .emoji svg { height:180px; width:auto; max-width:100%; display:block; margin:0 auto; }
  .word { font-size:2.2rem; font-weight:700; margin-top:10px; }
  .lang { font-size:.8rem; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
  .hint { color:var(--muted); margin-top:8px; font-size:.9rem; }
  .row { display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; align-items:center; }
  button.btn { border:none; border-radius:10px; padding:10px 18px; font-size:1rem; cursor:pointer; background:var(--accent2); color:#222; }
  button.btn:disabled { opacity:.45; cursor:default; }
  button.btn.ok { background:var(--ok); color:#fff; }
  button.btn.bad { background:var(--bad); color:#fff; }
  button.btn.ghost { background:#e8e2d6; }
  .options { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; }
  .options button { background:var(--card); border:2px solid #e3dccd; border-radius:12px; padding:14px; font-size:1.1rem; cursor:pointer; }
  .options button:hover:not(:disabled) { border-color:var(--accent2); }
  .options button.right { background:#d8f0e0; border-color:var(--ok); }
  .options button.wrong { background:#f6d9d5; border-color:var(--bad); }
  .list { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .list td { padding:9px 14px; border-bottom:1px solid #eee; }
  .list td:first-child { font-size:1.6rem; width:96px; }
  .list td:first-child svg { height:48px; width:auto; max-width:96px; display:block; }
  .list td.fach { color:var(--muted); font-size:.9rem; white-space:nowrap; }
  .hidden { display:none !important; }

  @media (max-width:520px){

    .word { font-size:1.8rem; }

<body>
<header>
  <h1><select id="langSel" class="langsel" aria-label="Sprache wählen"></select></h1>
  <nav>
    <button data-tab="cards" class="active">Karteikasten</button>
    <button data-tab="quiz">Quiz</button>
    <button data-tab="list">Liste</button>
  </nav>
</header>
<main>
  <div class="topic">
    <label for="topicSel"><b>Thema:</b></label>
    <select id="topicSel"></select>
    <span id="count"></span>
    <button class="btn ghost" id="resetBtn" style="margin-left:auto; padding:6px 12px; font-size:.85rem">Zähler auf 0 setzen</button>
  </div>

  <div id="cardTiles"><div class="boxes" id="boxes"></div></div>

  <section id="cards">
    <div id="study">
      <div class="flash" id="flash">
        <div class="lang" id="fLang"></div>
        <div class="emoji" id="fEmoji"></div>
        <div class="word" id="fWord"></div>
        <div class="hint" id="fHint">Tippen zum Umdrehen</div>
      </div>
      <div class="row">
        <button class="btn ghost" id="speak">🔊 Aussprache</button>
        <button class="btn ghost" id="dirBtn"></button>
      </div>
      <div class="row">
        <button class="btn bad" id="again" disabled>✗ Nicht gewusst</button>
        <button class="btn ok" id="known" disabled>✓ Gewusst</button>
      </div>
    </div>

    <div class="flash hidden" id="done" style="cursor:default">
      <div class="emoji">🎉</div>
      <div class="word" style="font-size:1.5rem" id="doneTitle"></div>
      <div class="hint" id="doneInfo"></div>
      <div class="row"><button class="btn" id="againBtn">Neue Runde</button><button class="btn" id="allBtn">Alle Wörter üben</button></div>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div class="boxes" id="qTiles"></div>
    <div class="row" style="margin:0 0 12px; justify-content:space-between">
      <span class="hint" id="qProgress" style="margin:0"></span>
      <button class="btn ghost" id="qNew">↻ Neues Quiz</button>
    </div>
    <div id="qReview" class="hidden" style="margin-bottom:16px"></div>
    <div id="qPlay">
      <div class="flash" style="cursor:default">
        <div class="emoji" id="qEmoji"></div>
        <div class="word" id="qWord"></div>
        <div class="hint" id="qHint"></div>
      </div>
      <div class="options" id="opts"></div>
      <div class="row">
        <button class="btn ghost" id="qSpeak">🔊 Aussprache</button>
        <button class="btn" id="next" disabled>Weiter</button>
      </div>
    </div>
    <div class="flash hidden" id="qDone" style="cursor:default">
      <div class="emoji">🏁</div>
      <div class="word" style="font-size:1.5rem">Quiz beendet</div>
      <div class="hint" id="qDoneInfo"></div>
      <div class="row"><button class="btn" id="qAgain">Neues Quiz</button></div>
    </div>
  </section>

  <section id="list" class="hidden">
    <table class="list" id="table"></table>
  </section>
</main>

function skin(){
  // Unterarm mit Markierung und vergrössertem Hautausschnitt
  let seed = 7; const rnd = () => (seed = (seed*9301+49297) % 233280) / 233280;
  let texture = "";
  const cx=160, cy=42, r=36;
  for (let i=0;i<70;i++){
    const a = rnd()*Math.PI*2, d = Math.sqrt(rnd())*(r-6);
    texture += `<circle cx="${(cx+Math.cos(a)*d).toFixed(1)}" cy="${(cy+Math.sin(a)*d).toFixed(1)}" r="${(0.8+rnd()*1.2).toFixed(1)}" fill="${SKD}"/>`;
  }
  for (let i=0;i<14;i++){
    const a = rnd()*Math.PI*2, d = Math.sqrt(rnd())*(r-14), x=cx+Math.cos(a)*d, y=cy+Math.sin(a)*d;
    texture += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} q6 -4 12 0" fill="none" stroke="${SKD}" stroke-width="1"/>`;
  }
  return svg("0 0 230 140", `
    <rect x="4" y="84" width="150" height="38" rx="18" fill="${SK}"/>
    <ellipse cx="170" cy="104" rx="26" ry="20" fill="${SK}"/>

    <line x1="76" y1="98" x2="${cx-12}" y2="${cy+34}" stroke="${RED}" stroke-width="2"/>
    ${ring(68,102,12)}
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="${SK}"/>${texture}${ring(cx,cy,r)}`);
}

const SHAPE_FILL = "#4169E1", SHAPE_DARK = "#2a46a8", SHAPE_LIGHT = "#7d9bf0";
const polyPts = (n, r, rot) => Array.from({length:n}, (_,i) => {
  const a = (rot + i*360/n) * Math.PI/180; return (50 + r*Math.cos(a)).toFixed(1) + "," + (50 + r*Math.sin(a)).toFixed(1);
}).join(" ");
function starPts(){
  return Array.from({length:10}, (_,i) => {
    const a = (-90 + i*36) * Math.PI/180, r = i%2 ? 20 : 46;
    return (50 + r*Math.cos(a)).toFixed(1) + "," + (52 + r*Math.sin(a)).toFixed(1);
  }).join(" ");
}
function spiralPath(){
  let d = "";
  for (let i=0;i<=120;i++){ const t = i/120*3.2*Math.PI*2, r = 2 + t*2.3;
    d += (i?"L":"M") + (50 + r*Math.cos(t)).toFixed(1) + " " + (50 + r*Math.sin(t)).toFixed(1) + " "; }
  return d;
}

};

// ---------- Weitere Zeichnungen (Zahlen, Kalender, Körperdetails) ----------
const ringE = (cx,cy,rx,ry) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="${RED}" stroke-width="3.5"/>`;

function numSvg(a){
  const fs = a.length <= 2 ? 70 : a.length <= 3 ? 60 : a.length <= 5 ? 46 : 32;
  return svg("0 0 200 100", `<rect x="4" y="4" width="192" height="92" rx="14" fill="#eef2ff" stroke="#c9d3f0" stroke-width="2"/>
    <text x="100" y="${(50 + fs*0.36).toFixed(1)}" font-size="${fs}" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,sans-serif" text-anchor="middle" fill="#2a46a8">${a}</text>`);
}

function weekSvg(a){
  const sel = a === "all" ? [0,1,2,3,4,5,6] : a === "we" ? [5,6] : a === "wd" ? [0,1,2,3,4] : [Number(a) - 1];
  let g = `<rect x="4" y="4" width="222" height="20" rx="5" fill="#2a46a8"/><circle cx="40" cy="14" r="3" fill="#fff"/><circle cx="190" cy="14" r="3" fill="#fff"/>`;
  for (let i = 0; i < 7; i++){
    const x = 6 + i*31.5, on = sel.includes(i);
    g += `<rect x="${x}" y="30" width="28" height="52" rx="5" fill="${on ? "#4169E1" : (i >= 5 ? "#f6dede" : "#eef2ff")}" stroke="${on ? "#2a46a8" : "#c9d3f0"}" stroke-width="2"/>`;
    g += `<circle cx="${x+14}" cy="44" r="4" fill="${on ? "#fff" : "#c9d3f0"}"/>`;
  }
  return svg("0 0 230 88", g);
}

const SEASON_BG = ["#dbe9ff","#dbe9ff","#dff5d8","#dff5d8","#dff5d8","#fff1b8","#fff1b8","#fff1b8","#ffe0c2","#ffe0c2","#ffe0c2","#dbe9ff"];
const SEASON_ICON = ["❄️","❄️","🌸","🌸","🌸","☀️","☀️","☀️","🍂","🍂","🍂","❄️"];
function monthSvg(a){
  const all = a === "all", n = Number(a) - 1;
  let g = "";
  for (let i = 0; i < 12; i++){
    const x = 6 + (i%4)*48, y = 6 + Math.floor(i/4)*48, on = all || i === n;
    g += `<rect x="${x}" y="${y}" width="44" height="44" rx="6" fill="${on ? "#4169E1" : SEASON_BG[i]}" stroke="${on ? "#2a46a8" : "rgba(0,0,0,.12)"}" stroke-width="2"/>`;
    g += `<text x="${x+22}" y="${y+29}" font-size="${on && !all ? 22 : 15}" text-anchor="middle" opacity="${on ? 1 : .55}">${SEASON_ICON[i]}</text>`;
  }
  return svg("0 0 200 152", g);
}

const GEN = {num:numSvg, week:weekSvg, month:monthSvg, hand:handSvg, face:faceSvg, eye:eyeSvg, body:bodySvg,
             back: b => figureBack(BACK_MARK[b] || ""), footside:footSideSvg};

const pic = w => {
  if (w.img && IMAGES[w.img]) return IMAGES[w.img]();
  if (w.img && w.img.startsWith("color:")) return swatch(w.img.slice(6));
  if (w.img && w.img.startsWith("shape:") && SHAPES[w.img.slice(6)]) return shapeSvg(w.img.slice(6));
  if (w.img && w.img.includes(":")) {
    const i = w.img.indexOf(":"), k = w.img.slice(0, i);
    if (GEN[k]) return GEN[k](w.img.slice(i + 1));
  }
  return w.emoji;
};

// ---------- Speicherstand ----------
const KEY = "vokabeln-4sprachen-v1";
let state = {known:{}, topic:"tiere", filter:"all", lang:"es"};
try {
  const s = JSON.parse(localStorage.getItem(KEY));
  if (s) Object.assign(state, s);
  else {
    // Fortschritt aus der Spanisch-App übernehmen (gleiche Web-Adresse)
    const old = JSON.parse(localStorage.getItem("spanisch-vokabeln-v6"));
    if (old && old.known) {
      Object.entries(old.known).forEach(([k, v]) => state.known["es:" + k] = v);
      if (old.topic) state.topic = old.topic;
    }
  }
} catch(e){}
if (!LANGS[state.lang]) state.lang = "es";
if (!TOPICS[state.topic]) state.topic = "tiere";
if (!["all","unknown","known"].includes(state.filter)) state.filter = "all";
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const words = () => TOPICS[state.topic].words;
const L = () => LANGS[state.lang];
const tgt = w => w[state.lang];

// ---------- Kategorien: Alle Wörter / Nicht gewusst / Gewusst ----------
const wordKey = w => state.lang + ":" + state.topic + ":" + w.id;
const isKnown = w => state.known[wordKey(w)] === true;
const isUnknown = w => state.known[wordKey(w)] === false;
const inFilter = w => state.filter === "all" || (state.filter === "known" ? isKnown(w) : isUnknown(w));
const FILTERS = [
  {id:"all",     label:"Alle Wörter",   cls:"",   count: () => words().length},
  {id:"unknown", label:"Nicht gewusst", cls:"b1", count: () => words().filter(isUnknown).length},
  {id:"known",   label:"Gewusst",       cls:"b5", count: () => words().filter(isKnown).length}
];
function renderTiles(){
  $("boxes").innerHTML = FILTERS.map(f =>
    `<div class="bx ${f.cls} ${state.filter===f.id ? "active" : ""}" data-f="${f.id}"><span class="n">${f.count()}</span><span class="t">${f.label}</span></div>`
  ).join("");
}
function setFilter(f){
  state.filter = f; save(); deck = []; roundOn = false;
  renderTiles(); nextCard(); renderList();
}
$("boxes").onclick = e => { const t = e.target.closest("[data-f]"); if (t) setFilter(t.dataset.f); };
$("allBtn").onclick = () => setFilter("all");
$("againBtn").onclick = () => { deck = []; roundOn = false; nextCard(); };

// «Zähler auf 0 setzen»: im Quiz startet es das Quiz neu, sonst setzt es die Karteikarten-Zähler zurück.
// (Bewusst ohne Rückfrage-Dialog: Browser-Dialoge werden in manchen Ansichten blockiert.)
let currentTab = "cards";
$("resetBtn").onclick = () => {
  if (currentTab === "quiz") { startQuiz(); return; }
  Object.keys(state.known).forEach(k => { if (k.startsWith(state.lang + ":")) delete state.known[k]; });
  state.filter = "all"; save(); deck = []; roundOn = false;
  renderTiles(); nextCard(); renderList();
};

// Sprach-Auswahl (oben in der Kopfleiste)
const langSel = $("langSel");
Object.entries(LANGS).forEach(([k, l]) => langSel.add(new Option(l.flag + " " + l.name + " Vokabeln", k)));
langSel.value = state.lang;
const dirLabel = () => "Richtung: " + (esToDe ? L().name + " → Deutsch" : "Deutsch → " + L().name);
function applyLang(){
  document.title = L().name + " Vokabeln";
  $("dirBtn").textContent = dirLabel();
}
langSel.onchange = () => {
  state.lang = langSel.value; save(); deck = []; roundOn = false;
  if (window.speechSynthesis) speechSynthesis.cancel();
  applyLang(); renderTiles(); nextCard(); startQuiz(); renderList();
};

// Themen-Auswahl
const sel = $("topicSel");
GROUPS.forEach(([g, keys]) => {
  const og = document.createElement("optgroup"); og.label = g;
  keys.forEach(k => og.appendChild(new Option(TOPICS[k].name, k)));
  sel.appendChild(og);
});
sel.value = state.topic;
sel.onchange = () => {
  state.topic = sel.value; save(); deck = []; roundOn = false;
  $("count").textContent = "(" + words().length + " Vokabeln)";
  renderTiles(); nextCard(); startQuiz(); renderList();
};

// Tabs
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x===b));
  ["cards","quiz","list"].forEach(t => $(t).classList.toggle("hidden", t!==b.dataset.tab));
  if (b.dataset.tab==="list") renderList();
  currentTab = b.dataset.tab;
  $("resetBtn").textContent = currentTab === "quiz" ? "Quiz neu starten (Zähler auf 0)" : "Zähler auf 0 setzen";
  $("cardTiles").classList.toggle("hidden", b.dataset.tab==="quiz");
  if (b.dataset.tab==="quiz" && !quizStarted) startQuiz();
});

// ---------- Karteikarten ----------
let deck = [], cur = null, flipped = false;
let roundOn = false, roundTotal = 0, roundOk = 0, roundBad = 0; // eine Runde = alle Karten der Kategorie einmal
let esToDe = false; // false: Vorderseite Deutsch, Rückseite Fremdsprache

function newRound(){
  deck = shuffle(words().filter(inFilter));
  roundTotal = deck.length; roundOk = 0; roundBad = 0; roundOn = true;
}
function nextCard(){
  if (!roundOn) newRound();
  if (!deck.length) { roundTotal ? showFinished() : showDone(); return; }
  $("study").classList.remove("hidden"); $("done").classList.add("hidden");
  cur = deck.pop(); flipped = false; showCard();
}
function showFinished(){
  $("study").classList.add("hidden"); $("done").classList.remove("hidden");
  $("doneTitle").textContent = "Training beendet";
  $("doneInfo").textContent = "Alle " + roundTotal + " Karten durchgegangen: " + roundOk + " gewusst, " + roundBad + " nicht gewusst.";
  $("againBtn").classList.remove("hidden"); $("allBtn").classList.add("hidden");
}
function showDone(){
  $("study").classList.add("hidden"); $("done").classList.remove("hidden");
  $("againBtn").classList.add("hidden"); $("allBtn").classList.remove("hidden");
  $("doneTitle").textContent = "Hier ist noch nichts drin";
  $("doneInfo").textContent = "Karten, die du mit «" + (state.filter === "unknown" ? "Nicht gewusst" : "Gewusst") + "» markierst, erscheinen hier.";
}
function showCard(){
  $("flash").classList.toggle("back", flipped);
  const showEs = esToDe ? !flipped : flipped;
  $("fLang").textContent = (showEs ? L().native : "Deutsch") + " · Karte " + (roundTotal - deck.length) + " von " + roundTotal;
  $("fEmoji").innerHTML = pic(cur);
  $("fWord").textContent = showEs ? tgt(cur) : cur.de;
  $("fHint").textContent = flipped ? "" : "Tippen zum Umdrehen";
  $("known").disabled = $("again").disabled = !flipped;
}
$("flash").onclick = () => { flipped = !flipped; showCard(); };
$("dirBtn").onclick = () => {
  esToDe = !esToDe;
  $("dirBtn").textContent = dirLabel();
  flipped = false; showCard();
};
function speak(text){
  if (!("speechSynthesis" in window)) return;
  // Das Zeichen «↔» bei Gegenteilen nicht mitlesen, sondern als kurze Pause sprechen
  text = text.replace(/\s*↔\s*/g, ". ");
  const u = new SpeechSynthesisUtterance(text); u.lang = L().voice; u.rate = .85;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
$("speak").onclick = () => speak(tgt(cur));

function rate(known){
  if (!flipped) return;
  state.known[wordKey(cur)] = known; save();
  if (known) roundOk++; else roundBad++;
  renderTiles(); renderList(); nextCard();
}
$("known").onclick = () => rate(true);
$("again").onclick = () => rate(false);

// ---------- Quiz ----------
// Eigene Zähler: starten bei jedem neuen Quiz bei 0. Jedes Wort wird einmal gefragt.
let qHideSpeak = false;
let quizStarted = false, qDeck = [], qOk = [], qBad = [], qTotal = 0, qView = null, qWord = null, answered = false;
const byId = id => words().find(w => w.id === id);

function startQuiz(){
  quizStarted = true;
  qDeck = shuffle(words()); qTotal = qDeck.length; qOk = []; qBad = []; qView = null; qWord = null;
  renderQuizTiles(); renderQuizReview(); newQuestion();
}
function renderQuizTiles(){
  const tile = (v, cls, n, label) => `<div class="bx ${cls} ${qView===v ? "active" : ""}" data-q="${v}"><span class="n">${n}</span><span class="t">${label}</span></div>`;
  $("qTiles").innerHTML =
    tile("all", "", qTotal, "Alle Wörter") +
    tile("bad", "b1", qBad.length, "Nicht gewusst") +
    tile("ok", "b5", qOk.length, "Gewusst");
  $("qProgress").textContent = (qOk.length + qBad.length) + " von " + qTotal + " beantwortet";
}
function renderQuizReview(){
  const box = $("qReview");
  if (!qView) { box.classList.add("hidden"); return; }
  const ids = qView === "all" ? words().map(w => w.id) : (qView === "ok" ? qOk : qBad);
  const title = qView === "all" ? "Alle Wörter" : (qView === "ok" ? "Gewusste Wörter" : "Nicht gewusste Wörter");
  box.classList.remove("hidden");
  box.innerHTML = `<div class="hint" style="margin:0 0 6px"><b>${title} (${ids.length})</b> – zum Ausblenden die Kachel nochmals anklicken</div>` +
    (ids.length
      ? `<table class="list">` + ids.map(id => { const w = byId(id); return `<tr><td>${pic(w)}</td><td><b>${tgt(w)}</b></td><td>${w.de}</td></tr>`; }).join("") + `</table>`
      : `<div class="hint">Noch keine Wörter hier.</div>`);
}
$("qTiles").onclick = e => {
  const t = e.target.closest("[data-q]"); if (!t) return;
  qView = (qView === t.dataset.q) ? null : t.dataset.q;
  renderQuizTiles(); renderQuizReview();
};
$("qNew").onclick = startQuiz;
$("qAgain").onclick = startQuiz;

function newQuestion(){
  answered = false; $("next").disabled = true;
  if (!qDeck.length) {
    $("qPlay").classList.add("hidden"); $("qDone").classList.remove("hidden");
    $("qDoneInfo").textContent = qOk.length + " gewusst, " + qBad.length + " nicht gewusst.";
    return;
  }
  $("qPlay").classList.remove("hidden"); $("qDone").classList.add("hidden");
  qWord = qDeck.pop();
  $("next").textContent = qDeck.length ? "Weiter" : "Ergebnis";
  const toSpanish = Math.random() < .5;
  // Ist die Frage deutsch, würde die Aussprache die Antwort verraten: dann erst nach dem Antworten.
  qHideSpeak = toSpanish; $("qSpeak").disabled = qHideSpeak;
  $("qEmoji").innerHTML = pic(qWord);
  $("qWord").textContent = toSpanish ? qWord.de : tgt(qWord);
  $("qHint").textContent = toSpanish ? "Wie heisst das auf " + L().name + "?" : "Was heisst das auf Deutsch?";
  const wrong = shuffle(words().filter(w => w.id!==qWord.id)).slice(0,3);
  const opts = shuffle([qWord, ...wrong]);
  const box = $("opts"); box.innerHTML = "";
  opts.forEach(o => {
    const b = document.createElement("button");
    b.textContent = toSpanish ? tgt(o) : o.de;
    b.onclick = () => {
      if (answered) return; answered = true;
      const ok = o.id === qWord.id;
      b.classList.add(ok ? "right" : "wrong");
      if (!ok) [...box.children].forEach((c,i) => { if (opts[i].id===qWord.id) c.classList.add("right"); });
      (ok ? qOk : qBad).push(qWord.id);
      renderQuizTiles(); renderQuizReview();
      $("qSpeak").disabled = false;
      $("next").disabled = false;
    };
    box.appendChild(b);
  });
}
$("next").onclick = newQuestion;
$("qSpeak").onclick = () => { if (qWord) speak(tgt(qWord)); };

// ---------- Liste ----------
function renderList(){
  $("table").innerHTML = words().filter(inFilter).map(w =>
    `<tr><td>${pic(w)}</td><td><b>${tgt(w)}</b></td><td>${w.de}</td><td class="fach">${isKnown(w) ? "✅ gewusst" : isUnknown(w) ? "nicht gewusst" : ""}</td></tr>`
  ).join("");
}

$("count").textContent = "(" + words().length + " Vokabeln)";
applyLang(); renderTiles(); nextCard(); renderList();

// Offline-Betrieb als Web-App
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
